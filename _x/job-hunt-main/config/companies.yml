# Direct APIs for these are unreachable: Microsoft's gcsservices host serves a
# cert for *.azureedge.net (hostname mismatch, endpoint decommissioned),
# Google's careers API 404s, Meta's GraphQL needs a doc_id, Apple returns 401,
# and Tesla/Dice 403 behind Cloudflare. They all post to the aggregators, so
# we reach them with company-targeted searches rather than keyword-only ones.
- source: aggregator
  company: BigTech via aggregators
  bucket: bigtech
  sites: [indeed, linkedin]
  hours_old: 336
  results_per_term: 25
  terms:
    - Microsoft machine learning engineer
    - Microsoft AI engineer
    - Google machine learning engineer
    - Google AI engineer
    - Meta machine learning engineer
    - Apple machine learning engineer
    - Tesla machine learning engineer
    - Netflix machine learning engineer
    - Uber machine learning engineer

