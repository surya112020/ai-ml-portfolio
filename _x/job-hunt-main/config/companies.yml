# ------------------------------------------------- staffing via aggregators
# Kforce, Insight Global, Randstad, TEKsystems and Robert Half all returned
# 404/401/403 from their own sites. They publish to Indeed and LinkedIn, so
# we read them there instead. Expected to be flaky on CI (datacenter IPs get
# blocked); reliable locally.
- source: aggregator
  company: Aggregators
  bucket: enterprise   # per-row bucketing overrides this
  sites: [indeed, linkedin]
  hours_old: 336
  results_per_term: 40
  terms:
    - machine learning engineer
    - AI engineer
    - LLM engineer
    - generative AI engineer
    - MLOps engineer
    - applied scientist

