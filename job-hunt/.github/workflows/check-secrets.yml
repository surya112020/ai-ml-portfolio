name: check secrets

# Manual only. Verifies the three repo secrets are present and that the
# Telegram credentials actually work *from GitHub's network*, which is the
# thing a local test-alert cannot prove.
#
# Never prints a secret value — only lengths and a masked prefix, which is
# enough to spot a truncated paste or a stray newline.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      # Names of what IS configured, so a missing secret can be told apart
      # from one added under the Variables tab or misspelled. Only keys are
      # printed — values never leave the JSON blob.
      - name: What is actually configured?
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          python3 - <<'PY'
          import json, os
          sec = sorted(json.loads(os.environ["SECRETS_JSON"] or "{}"))
          var = sorted(json.loads(os.environ["VARS_JSON"] or "{}"))
          sec = [s for s in sec if s != "github_token"]
          print("Repository SECRETS visible to this workflow:")
          print("  " + (", ".join(sec) if sec else "(none)"))
          print("Repository VARIABLES visible to this workflow:")
          print("  " + (", ".join(var) if var else "(none)"))

          want = {"TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID", "IDENTITY_YML"}
          misplaced = want & set(var)
          if misplaced:
              print(f"::error::{', '.join(sorted(misplaced))} were added as "
                    "VARIABLES, not secrets. Delete them from the Variables "
                    "tab and re-add under Secrets.")
          near = [s for s in sec if s.upper().replace("-", "_") in want
                  and s not in want]
          if near:
              print(f"::error::Name mismatch (case matters): {', '.join(near)}")
          PY

      - name: Are the secrets present?
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          IDENT: ${{ secrets.IDENTITY_YML }}
        run: |
          fail=0
          check () {
            if [ -z "$2" ]; then
              echo "::error::$1 is MISSING or empty"; fail=1
            else
              echo "$1: set (${#2} chars)"
            fi
          }
          check TELEGRAM_BOT_TOKEN "$TOKEN"
          check TELEGRAM_CHAT_ID   "$CHAT"
          check IDENTITY_YML       "$IDENT"

          # A token pasted with a trailing newline or quotes is the usual
          # cause of a silent 401 later.
          case "$TOKEN" in
            *[!0-9A-Za-z:_-]*) echo "::warning::TELEGRAM_BOT_TOKEN contains unexpected characters (stray quote or newline?)";;
          esac
          case "$CHAT" in
            ''|*[!0-9-]*) echo "::warning::TELEGRAM_CHAT_ID should be digits (may start with -)";;
          esac
          exit $fail

      - name: Does the bot token work?
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          code=$(curl -s -o /tmp/me.json -w '%{http_code}' \
                 "https://api.telegram.org/bot${TOKEN}/getMe")
          if [ "$code" != "200" ]; then
            echo "::error::getMe returned HTTP $code — the token is wrong"
            exit 1
          fi
          echo "bot: $(python3 -c "import json;print(json.load(open('/tmp/me.json'))['result']['username'])")"

      - name: Send a real message from GitHub
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          code=$(curl -s -o /tmp/send.json -w '%{http_code}' \
            -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' \
            -d "{\"chat_id\":\"${CHAT}\",\"parse_mode\":\"HTML\",\"text\":\"✅ <b>GitHub Actions can reach you.</b>\n\nSecrets are set correctly. Hourly polling will alert here when a new 70+ opening appears.\"}")
          if [ "$code" != "200" ]; then
            echo "::error::sendMessage returned HTTP $code"
            cat /tmp/send.json
            echo "::error::HTTP 400 usually means TELEGRAM_CHAT_ID is wrong."
            exit 1
          fi
          echo "Message sent — check Telegram."

      - name: Is IDENTITY_YML valid?
        env:
          IDENT: ${{ secrets.IDENTITY_YML }}
        run: |
          printf '%s' "$IDENT" > /tmp/identity.yml
          python3 - <<'PY'
          import sys, yaml
          try:
              data = yaml.safe_load(open('/tmp/identity.yml')) or {}
          except yaml.YAMLError as exc:
              print(f"::error::IDENTITY_YML is not valid YAML: {exc}")
              sys.exit(1)
          auth = data.get('work_authorization') or {}
          ident = data.get('identity') or {}
          if not ident.get('name'):
              print("::warning::identity.name missing — scoring still works, "
                    "but tailoring would produce a nameless resume")
          print("IDENTITY_YML parses. "
                f"clearance_eligible={auth.get('clearance_eligible')}, "
                f"requires_sponsorship_future={auth.get('requires_sponsorship_future')}")
          PY
